name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_sentinelreview.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/ tests/

      - name: Run tests
        run: PYTHONPATH=backend pytest tests/ -v

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: |
          pip install mypy
          mypy backend/app --ignore-missing-imports
